<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Lari Kata Rumah</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--card:#fffaf0;--ink:#1d2b4f;--mut:#5b6785;--acc:#ff8a1f;--on:#1d2b4f;--onx:#fff;--line:#e6dcc4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e2a44;--ink:#f6efdc;--mut:#b4bdd3;--on:#ffd166;--onx:#1d2b4f;--line:#3a4968}}
:root[data-theme="dark"]{--card:#1e2a44;--ink:#f6efdc;--mut:#b4bdd3;--on:#ffd166;--onx:#1d2b4f;--line:#3a4968}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Fredoka,system-ui,"Segoe UI",sans-serif;background:#9fdcf5;touch-action:none;user-select:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;border:0}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 10px;pointer-events:none}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;font-weight:700;color:#fff;text-shadow:0 2px 0 #1d2b4f}
.row>*{background:#1d2b4fcc;padding:4px 10px;border-radius:14px;text-shadow:none;font-size:15px}
#qb{margin:8px auto 0;max-width:520px;background:var(--card);color:var(--ink);border:4px solid var(--acc);border-radius:20px;padding:8px 52px 8px 14px;text-align:center;position:relative}
#ql{color:var(--mut);font-size:13px}
#q{font-size:clamp(22px,5.5vw,32px);font-weight:700;line-height:1.1}
#spk{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--acc);font-size:18px;pointer-events:auto}
#fb{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,40px);font-weight:700;color:#fff;text-shadow:0 3px 0 #1d2b4f,0 0 12px #1d2b4f;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;width:90%}
#ctl{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 14px}
#ctl button{width:68px;height:68px;border-radius:50%;background:#ffffffd9;color:#1d2b4f;font-size:26px;box-shadow:0 4px 0 #1d2b4f}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:#1d2b4f66}
.card{background:var(--card);color:var(--ink);border-radius:26px;border:5px solid var(--acc);padding:16px 20px;width:100%;max-width:470px;max-height:94vh;overflow:auto;text-align:center;box-shadow:0 8px 0 #1d2b4f}
h1{margin:4px 0;font-size:clamp(30px,8vw,42px);line-height:1;color:var(--acc);text-shadow:0 2px 0 var(--ink)}
h2{margin:4px 0;font-size:28px}h3{margin:12px 0 6px;font-size:16px}
p{margin:6px 0;color:var(--mut);font-size:14px}
#him{height:130px;margin-top:-4px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:14px;background:transparent;border:2px solid var(--line);color:var(--ink);font-weight:500}
.seg button.on{background:var(--on);color:var(--onx);border-color:var(--on)}
#names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#names input{font:inherit;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);width:100%}
.go{margin-top:14px;background:var(--acc);color:#fff;font-weight:700;font-size:20px;padding:12px 28px;border-radius:18px;box-shadow:0 4px 0 #1d2b4f}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #1d2b4f}
.big{font-size:48px;font-weight:700;color:var(--acc)}.stars{font-size:34px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
tr.w td{font-weight:700;color:var(--acc)}
.sm{font-size:15px;padding:9px 16px;margin:10px 4px 0;box-shadow:none}
#mu{pointer-events:auto;cursor:pointer}
</style></head><body>

 qs.forEach((q,i)=>{const gz=-GAP*(i+1);world.add(gate(gz,q.opts));st.gates.push({z:gz,q});
  [.6,.25].forEach(w=>{const bl=sh([0,1,2]),nb=diff==2?2:1;
  for(let b=0;b<nb;b++){const m=mesh(new THREE.BoxGeometry(1.8,1.1,1.6),0xb5793a,LX[bl[b]],.55,gz+GAP*w);m.add(mesh(new THREE.BoxGeometry(1.9,.15,1.7),0xe0a45e,0,.55,0));world.add(m);st.items.push({m,t:'o',on:true})}
  for(let k=0;k<6;k++){const m=mesh(starG,0xffd21f,LX[bl[2]],1.2,gz+GAP*(w+.28)-k*3);m.material.emissive=new THREE.Color(0xaa7a00);world.add(m);st.items.push({m,t:'s',on:true})}})});
 $('#hud').hidden=$('#ctl').hidden=false;music(true);$('#tn').textContent=teams[cur].n;showQ();hud();fb('Siap? Lari!');
 setTimeout(()=>st&&(st.go=true),1300)}
function showQ(){const s=st;if(s.qi>=s.qs.length){$('#ql').textContent='';$('#q').textContent='Menuju garis finis!';return}
 const q=s.qs[s.qi];$('#ql').textContent=q.d?'Pilih kata Inggris untuk:':'Pilih arti dari:';$('#q').textContent=q.q;if(!q.d)speak(q.en)}
function hud(){const s=st;$('#hh').textContent='❤️'.repeat(s.h)+'🖤'.repeat(3-s.h);$('#ss').textContent='⭐'+s.stars;$('#sc').textContent=s.ok*10+s.stars*2+' poin'}
let ft;function fb(t){const e=$('#fb');e.textContent=t;e.style.opacity=1;clearTimeout(ft);ft=setTimeout(()=>e.style.opacity=0,1400)}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function hurt(){const s=st;s.h--;s.inv=1.3;s.sh=.4;hud();if(s.h<=0){s.done=true;fb('Nyawa habis!');setTimeout(endTurn,1200)}}
function resolve(g){const s=st,l=Math.max(0,Math.min(2,Math.round(s.x/4)+1)),q=g.q;
 if(l==q.ans){s.ok++;sfx('ok');fb('✅ Benar!  '+q.en);if(q.d)setTimeout(()=>speak(q.en),450)}else{sfx('bad');fb('❌ Jawaban: '+q.opts[q.ans]);hurt()}
 s.qi++;hud();if(!s.done)showQ()}
function limbs(ph,air){const a=air?.9:Math.sin(ph),b=air?-.9:-a;H.lL.rotation.x=a*.9;H.lR.rotation.x=b*.9;H.aL.rotation.x=b*.9;H.aR.rotation.x=a*.9;H.hd.rotation.z=Math.sin(ph/2)*.05}
function upd(dt){const s=st;
 if(s.go&&!s.done){s.z-=s.sp*dt;s.ph+=dt*s.sp*.85}
 s.x+=(LX[s.lane]-s.x)*Math.min(1,dt*12);s.vy-=26*dt;s.y=Math.max(0,s.y+s.vy*dt);if(!s.y)s.vy=0;
 s.inv=Math.max(0,s.inv-dt);s.sh=Math.max(0,s.sh-dt);
 H.g.position.set(s.x,s.y+Math.abs(Math.sin(s.ph))*.1*(s.y==0),s.z);H.g.rotation.z=(LX[s.lane]-s.x)*.05;H.g.visible=!s.inv||(s.inv*12|0)%2==0;
 limbs(s.ph,s.y>.1);
 if(!s.done){
  s.items.forEach(it=>{if(!it.on)return;const p=it.m.position;if(it.t=='s')it.m.rotation.y+=dt*3;
   if(Math.abs(p.z-s.z)<(it.t=='s'?.9:.85)&&Math.abs(p.x-s.x)<1.3){
    if(it.t=='s'){it.on=false;it.m.visible=false;s.stars++;sfx('star');hud()}else if(!s.inv&&s.y<1){it.on=false;it.m.visible=false;sfx('bad');fb('Aduh! Rintangan!');hurt()}}});
  const g=s.gates[s.qi-(s.qi>=s.gates.length?0:0)];if(g&&!g.d&&s.z<g.z){g.d=true;resolve(g)}
  if(s.z<s.fin)endTurn()}
 const k=s.sh?Math.sin(s.sh*60)*.15:0;cam.position.set(s.x*.6+k,4.6,s.z+8.5);cam.lookAt(s.x*.6,1.4,s.z-10)}
function idle(t){H.g.position.set(0,0,0);H.g.rotation.z=0;H.g.visible=true;limbs(t/140);cam.position.set(2.6,2.3,-6.2);cam.lookAt(0,1.5,0)}
let lt=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lt)/1000||0);lt=t;st?upd(dt):idle(t);R.render(S,cam)}
build(1,20);requestAnimationFrame(loop);
/* ---------- screens ---------- */
const show=h=>{$('#s2').innerHTML=h;$('#s2').hidden=false;$('#s1').hidden=true};
function ready(){const t=teams[cur];st=null;show(`<div class="card"><p>Giliran grup ${cur+1} dari ${teams.length}</p><h2>${esc(t.n)}</h2><p>Kumpulkan bintang, hindari kotak, dan lari ke gerbang yang benar. Kata Inggris akan dibacakan.</p><button class="go" id="rd">Lari!</button></div>`);$('#rd').onclick=startTurn}
function endTurn(){const s=st;if(!s||s.fd)return;s.fd=true;const t=teams[cur];t.ok=s.ok;t.stars=s.stars;t.pts=s.ok*10+s.stars*2;t.rt=s.ok>=7?3:s.ok>=4?2:s.ok>=1?1:0;
 $('#hud').hidden=$('#ctl').hidden=true;music(false);st=null;const last=cur==teams.length-1;
 show(`<div class="card"><h2>${esc(t.n)} selesai!</h2><div class="big">${t.pts} poin</div><div class="stars">${'⭐'.repeat(t.rt)}${'☆'.repeat(3-t.rt)}</div><p>Benar ${t.ok} dari 8. Bintang dikumpulkan: ${t.stars}</p><button class="go" id="nx">${last?'Lihat skor akhir':'Giliran '+esc(teams[cur+1].n)}</button></div>`);
 $('#nx').onclick=()=>{if(last)final();else{cur++;ready()}}}
function final(){const r=[...teams].sort((a,b)=>b.pts-a.pts),md=['🥇','🥈','🥉'];
 show(`<div class="card"><h2>Skor Akhir</h2><table><tr><th></th><th>Grup</th><th>Bintang</th><th>Benar</th><th>Poin</th></tr>${r.map((t,i)=>`<tr class="${i?'':'w'}"><td>${md[i]||i+1}</td><td>${esc(t.n)}</td><td>${'⭐'.repeat(t.rt)||'-'}</td><td>${t.ok}/8</td><td>${t.pts}</td></tr>`).join('')}</table><p>Bintang: 7-8 benar = 3, 4-6 = 2, 1-3 = 1.</p><button class="go sm" id="ag">Main lagi</button><button class="go sm" id="rs">Atur ulang</button></div>`);
 $('#ag').onclick=begin;$('#rs').onclick=()=>{$('#s2').hidden=true;$('#s1').hidden=false}}
function begin(){teams=nm.slice(0,nT).map((n,i)=>({n:n.trim()||'Grup '+(i+1)}));cur=0;ready()}
function seg(el,ls,get,set){el.innerHTML='';ls.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.className=get()==i?'on':'';b.onclick=()=>{set(i);seg(el,ls,get,set)};el.appendChild(b)})}
function names(){$('#names').innerHTML='';for(let i=0;i<nT;i++){const e=document.createElement('input');e.placeholder='Grup '+(i+1);e.maxLength=18;e.value=nm[i]||'';e.oninput=()=>nm[i]=e.value;$('#names').appendChild(e)}}
seg($('#nt'),['1','2','3','4','5','6','7'],()=>nT-1,i=>{nT=i+1;names()});names();
seg($('#lv'),['Mudah','Sedang','Sulit'],()=>diff,i=>diff=i);
$('#go').onclick=()=>{nm=[...$('#names').children].map(e=>e.value);$('#s1').hidden=true;begin()};
/* ---------- kontrol ---------- */
const mv=d=>{if(st&&st.go&&!st.done)st.lane=Math.max(0,Math.min(2,st.lane+d))},jp=()=>{if(st&&st.go&&!st.done&&st.y==0)st.vy=9.5};
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')mv(-1);else if(k=='ArrowRight'||k=='d')mv(1);else if(k=='ArrowUp'||k=='w'||k==' '){e.preventDefault();jp()}});
[['#bl',()=>mv(-1)],['#br',()=>mv(1)],['#bj',jp]].forEach(([s,f])=>$(s).addEventListener('pointerdown',e=>{e.preventDefault();f()}));
$('#spk').onclick=()=>st&&st.qs[st.qi]&&speak(st.qs[st.qi].en);
$('#mu').onclick=mute;
let sx,sy;$('#c').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
$('#c').addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<-35)jp()});
